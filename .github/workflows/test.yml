```yml
name: Test Go

on: [push]

jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Go environment
        uses: actions/setup-go@v3
        with:
          go-version: 1.19
      - name: Test Go program
        run: go test -v
      - name: Success!
        run: echo 'Test completed successfully'

```